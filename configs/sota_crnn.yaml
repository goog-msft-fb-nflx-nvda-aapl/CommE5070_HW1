# Method 1. Reproduce with:
#   python -m src.train --model sota_crnn --data_index_dir data/index \
#     --out_dir results/sota_crnn --epochs 80 --batch_size 32 --patience 15 --num_workers 8
model: sota_crnn
input: waveform_chunk    # raw 16kHz, 5s chunks; model computes its own internal mel (n_fft=512, n_mels=96)
epochs: 80
batch_size: 32
lr: 1.0e-3
optimizer: adam
patience: 15
num_workers: 8
env: hw1_singer_env (torch 2.5.1+cu121)
result: best_epoch=73 best_top1=0.5844
