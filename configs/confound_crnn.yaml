# Task-2 core model (Method 2-2). Reproduce with:
#   python -m src.train --model confound_crnn --data_index_dir data/index \
#     --out_dir results/confound_crnn --epochs 80 --batch_size 32 --patience 15 --num_workers 8
model: confound_crnn
input: mel_chunk        # log-mel, n_mels=128, n_fft=2048, hop=512, chunk_frames=157 (~5.02s)
epochs: 80
batch_size: 32
lr: 1.0e-3
optimizer: adam
patience: 15
num_workers: 8
env: hw1_singer_env (torch 2.5.1+cu121)
